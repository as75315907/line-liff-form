<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 租金行情估價表單</title>
    <!-- 🎯 視覺優化：改用極速載入的標準 CSS 庫，取代原本卡頓的線上編譯 JS 庫 -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <script src="https://line-scdn.net"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

    <div class="bg-emerald-600 text-white px-4 py-5 shadow-md text-center" style="background-color: #059669;">
        <h1 class="text-xl font-bold">📊 桃園租金實價 AI 估價系統</h1>
        <p class="text-xs text-emerald-100 mt-1">請填寫物件條件，系統將自動比對周邊 500m 實價登錄</p>
    </div>

    <form id="valuationForm" class="max-w-md mx-auto px-4 mt-6 space-y-6">
        <!-- 1. 地址 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">🏠 物件出租地址</label>
            <input type="text" id="address" required class="w-full px-3 py-3 border border-gray-300 rounded-lg text-sm" placeholder="例如：桃園區中正路100號">
        </div>

        <!-- 2. 型態 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-3">🏢 建物型態</label>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" data-value="住宅大樓" class="type-btn py-2 text-xs font-medium rounded-lg bg-green-100 text-green-700 border border-green-500">住宅大樓</button>
                <button type="button" data-value="公寓" class="type-btn py-2 text-xs font-medium rounded-lg bg-white text-gray-600 border border-gray-200">公寓</button>
            </div>
            <input type="hidden" id="build_type" value="住宅大樓">
        </div>

        <!-- 3. 坪數 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">📐 建物室內坪數</label>
            <input type="number" id="ping" required min="1" step="0.1" class="w-full px-3 py-3 border border-gray-300 rounded-lg text-sm" placeholder="請輸入坪數">
        </div>

        <!-- 4. 格局房數 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-4 flex justify-between items-center">
            <span class="text-sm font-bold text-gray-700">🛏️ 房間現況格局</span>
            <input type="number" id="roomCount" value="3" min="1" max="10" class="w-16 p-1 border rounded text-center font-bold">
        </div>

        <button type="submit" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-md text-base" style="background-color: #059669;">
            🚀 開始智能大數據估價
        </button>
    </form>

    <script>
        // 填入您當前正式的 LIFF ID
        liff.init({ liffId: '2010244163-VIqAQpzj' })
            .then(() => { if (!liff.isLoggedIn()) { liff.login(); } })
            .catch((err) => { console.error(err); });

        // 型態按鈕切換簡化邏輯
        const buttons = document.querySelectorAll('.type-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => { b.className = "type-btn py-2 text-xs font-medium rounded-lg bg-white text-gray-600 border border-gray-200"; });
                btn.className = "type-btn py-2 text-xs font-medium rounded-lg bg-green-100 text-green-700 border border-green-500";
                document.getElementById('build_type').value = btn.getAttribute('data-value');
            });
        });

        document.getElementById('valuationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const address = document.getElementById('address').value;
            const build_type = document.getElementById('build_type').value;
            const ping = parseFloat(document.getElementById('ping').value);
            const rooms = document.getElementById('roomCount').value;

            const messageText = `【智能估價】{"address":"${address}","lat":24.9936,"lng":121.3114,"type":"${build_type}","rooms":${rooms},"ping":${ping},"is_social":false}`;

            liff.sendMessages([{ type: 'text', text: messageText }])
                .then(() => { liff.closeWindow(); })
                .catch((err) => { alert('請在 LINE 內開啟。'); });
        });
    </script>
</body>
</html>
